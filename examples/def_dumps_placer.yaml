# EXAMPLE config: a placer binary that you supply (for example your own NTUplace4dr build) and that writes one DEF
# per snapshot, named <iter>[_<stage>].def, into a directory (docs/SNAPSHOT_FORMAT.md, option A). placeviz ships no
# placer code and no placer patch. The binary, its flags and SNAP_DIR (the variable that tells this binary where to
# write its dumps) are placeholders for whatever your binary uses.
# Split LEF: `set -- {lef}` puts the tech LEF in $1 and the cell LEF in $2.
# EXAMPLE PATHS: replace every /path/to/... with your own.
output: /path/to/placeviz-output/def_dumps
benchmarks:
  - name: mgc_pci_bridge32_a
    lef: [/path/to/ispd2015_fix/mgc_pci_bridge32_a/tech.lef, /path/to/ispd2015_fix/mgc_pci_bridge32_a/cells.lef]
    def: /path/to/ispd2015_fix/mgc_pci_bridge32_a/mgc_pci_bridge32_a.def
modes: [fix, mov]
placers:
  - name: myplacer
    label: My placer (DEF dumps)
    cmd: "set -- {lef}; /path/to/your/placer -tech_lef $1 -cell_lef $2 -floorplan_def {def} -output {out_def}
          $([ {mode} = mov ] && echo --your-mixed-size-flag)"
    env: {SNAP_DIR: "{snap_dir}", OMP_NUM_THREADS: "{threads}"}
gr: no
dr: no
congestion: rudy
max_frames: 100
jobs: 2
threads: 8
