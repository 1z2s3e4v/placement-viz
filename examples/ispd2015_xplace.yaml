# EXAMPLE config (tested end to end): ISPD 2015 mgc_pci_bridge32_a, fixed-macro + mixed-size, Xplace-Route through
# examples/adapters/xplace_example.sh, CU-GR + Dr.CU with the violation dump (tools/drcu_vio_dump.patch), ggr congestion.
# EXAMPLE PATHS: replace every /path/to/... with your own. For the built-in estimate use `congestion: rudy`.
output: /path/to/placeviz-output/ispd2015_xplace
benchmarks:
  - name: mgc_pci_bridge32_a
    lef: /path/to/ispd2015_fix/mgc_pci_bridge32_a/mgc_pci_bridge32_a.lef
    def: /path/to/ispd2015_fix/mgc_pci_bridge32_a/mgc_pci_bridge32_a.def
modes: [fix, mov]
placers:
  - name: xplace
    label: Xplace-Route
    cmd: "bash /path/to/placement-viz/examples/adapters/xplace_example.sh {lef0} {def} {out_def} {snap_dir} {mode} {design}"
    env:
      XPLACE: /path/to/Xplace                  # Xplace checkout with its extensions built
      XPLACE_ENV: /path/to/xplace_env.sh       # optional: script that activates Xplace's python env
      THREADS: "{threads}"
gr:
  name: CU-GR
  cmd: "ln -sf /path/to/cugr/POST9.dat /path/to/cugr/POWV9.dat . &&
        /path/to/cugr/iccad19gr -lef {lef0} -def {def} -output {guide} -threads {threads} -rrrIters 3"
dr:
  name: Dr.CU
  cmd: "/path/to/dr-cu/build/ispd19dr -lef {lef0} -def {def} -guide {guide} -output {dr_def} -threads {threads}
        -tat 2000000000 -multiNetVerbose MIDDLE"
  env: {DRCU_VIO_DUMP: "{route_dir}/vio.csv"}
  vio_csv: "{route_dir}/vio.csv"
congestion: {backend: ggr, xplace: /path/to/Xplace}
max_frames: 100
jobs: 1                                        # one GPU job at a time
threads: 8
